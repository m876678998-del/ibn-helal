<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ابن هلال للمنظفات والمعطرات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f5f5f5; margin: 0; }
        header { background: linear-gradient(135deg, #2c5530, #27ae60); color: white; padding: 30px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 28px; }
       .container { max-width: 1200px; margin: 20px auto; padding: 20px; }
       .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
       .product { background: white; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,0.1); transition: 0.3s; }
       .product:hover { transform: translateY(-5px); }
       .product img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; }
       .product h3 { color: #2c5530; margin: 12px 0; font-size: 16px; }
       .product p { font-size: 22px; font-weight: bold; color: #e74c3c; margin: 10px 0; }
       .product button { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
       .product button:hover { background: #219150; }
       .cart { position: fixed; top: 20px; left: 20px; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 3px 15px rgba(0,0,0,0.2); z-index: 1000; }
        #cart-count { background: red; color: white; border-radius: 50%; padding: 3px 9px; font-weight: bold; }
       .cart button { background: #25D366; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
       .loading { text-align: center; font-size: 20px; padding: 50px; }
    </style>
</head>
<body>
    <header>
        <h1>🏪 ابن هلال للمنظفات والمعطرات</h1>
        <p>الجودة اللي تستاهلها - التوصيل لكل مكان</p>
    </header>

    <div class="cart">
        🛒 السلة: <span id="cart-count">0</span>
        <button onclick="sendOrder()">اطلب عبر واتساب</button>
    </div>

    <div class="container">
        <div id="products" class="products">
            <div class="loading">جاري تحميل المنتجات...</div>
        </div>
    </div>

    <script>
        let cart = [];
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSv7AAV_cVCseJEivgJi3ZKwCFPIa489jUtE5adrOuSBDMr9Kfn_gNJS9qSNfVhq-zv-KRnWOR0IiHf/pub?output=csv";

        // قراءة المنتجات من جوجل شيت
        fetch(CSV_URL)
       .then(res => res.text())
       .then(data => {
            const rows = data.split('\n').slice(1); // نشيل اول سطر العناوين
            let html = '';
            rows.forEach(row => {
                if(row.trim() === '') return;
                const cols = row.split(',');
                const name = cols[0];
                const price = cols[1];
                const image = cols[2];
                if(name && price && image) {
                    html += `
                    <div class="product">
                        <img src="${image}" onerror="this.src='https://via.placeholder.com/250'">
                        <h3>${name}</h3>
                        <p>${price} ج</p>
                        <button onclick="addToCart('${name}', ${price})">اضف للسلة</button>
                    </div>`;
                }
            });
            document.getElementById('products').innerHTML = html || '<p>لا توجد منتجات</p>';
        }).catch(err => {
            document.getElementById('products').innerHTML = '<p>حدث خطأ في تحميل المنتجات</p>';
        });

        function addToCart(name, price) {
            cart.push({name, price});
            document.getElementById('cart-count').innerText = cart.length;
            alert('✅ تم اضافة ' + name + ' للسلة');
        }

        function sendOrder() {
            if(cart.length === 0) { alert('السلة فاضية'); return; }
            let message = 'طلب جديد من موقع ابن هلال:%0A%0A';
            let total = 0;
            cart.forEach(item => {
                message += `• ${item.name}: ${item.price} ج%0A`;
                total += Number(item.price);
            });
            message += `%0Aالاجمالي: ${total} ج%0A%0Aالاسم: %0Aالعنوان: %0Aرقم التليفون:`;
            window.open(`https://wa.me/201120431784?text=${message}`, '_blank');
        }
    </script>
</body>
</html>
