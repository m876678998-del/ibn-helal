<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ابن هلال للمنظفات والمعطرات</title>
<style>
* {box-sizing: border-box; margin: 0; padding: 0;}
body{font-family:tahoma;background:#f8f9fa;margin:0;padding:0;color:#333}
header{background:linear-gradient(135deg,#27ae60,#2ecc71);color:white;text-align:center;padding:30px 20px; position:relative}
.cart-icon{position:absolute; top:20px; left:20px; background:white; color:#27ae60; padding:10px 15px; border-radius:50px; cursor:pointer; font-weight:bold}
.logo-box{background:#27ae60; padding:12px; border-radius:50%; display:inline-block; margin-bottom:15px; box-shadow:0 0 0 4px gold;}
.logo-box img{width:100px;height:100px;border-radius:50%;background:white;display:block;object-fit:contain;}
h1{margin:10px 0 0;font-size:24px}
.container{max-width:1100px;margin:20px auto;padding:20px}
h2{text-align:center; color:#27ae60; margin-bottom:20px; font-size:28px}
.filters{text-align:center; margin-bottom:20px}
.filters button{background:#27ae60; color:white; border:none; padding:10px 20px; margin:5px; border-radius:8px; cursor:pointer; font-size:16px; transition:0.3s}
.filters button.active,.filters button:hover{background:#2c3e50}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:white;border-radius:12px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1);text-align:center; transition:0.3s;}
.card:hover{transform: translateY(-5px);}
.card img{width:100%;height:200px;object-fit:contain;border-radius:8px; background:#f1f1f1; margin-bottom:10px}
.card h3{color:#27ae60;margin:10px 0; font-size:18px; min-height:50px}
.card.price{font-size:22px; color:#e67e22; font-weight:bold; margin:10px 0}
.card.category{font-size:14px; color:#999; margin-bottom:10px}
.add-btn{display:inline-block; background:#27ae60; color:white; padding:10px 20px; border-radius:8px; border:none; cursor:pointer; font-weight:bold; width:100%}
footer{background:#2c3e50;color:white;text-align:center;padding:25px;margin-top:30px}
.loading{text-align:center; padding:50px; font-size:20px; color:#27ae60}

/* السلة */
.cart-modal{display:none; position:fixed; top:0; right:0; width:350px; height:100%; background:white; box-shadow:-5px 0 15px rgba(0,0,0,0.2); z-index:1000; padding:20px; overflow-y:auto}
.cart-item{display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px}
.cart-total{font-size:20px; font-weight:bold; color:#e67e22; margin:20px 0; text-align:center}
.checkout-btn{background:#25D366; color:white; padding:15px; border:none; border-radius:8px; width:100%; font-size:18px; cursor:pointer}
.close-cart{float:left; font-size:24px; cursor:pointer; color:#999}
</style>
</head>
<body>
<header>
  <div style="background:#ffcc00; color:#000; text-align:center; padding:15px; font-size:20px; font-weight:bold;">
  🔥 عروض الافتتاح - خصم 10% على اول اوردر 🔥
  </div>
  <div class="cart-icon" onclick="openCart()">🛒 السلة (<span id="cart-count">0</span>)</div>
  <div class="logo-box">
    <img src="https://raw.githubusercontent.com/m876678998-del/ibn-helal/main/%D9%84%D9%88%D8%AC%D9%88%20%D8%A7%D8%A8%D9%86%20%D9%87%D9%84%D8%A7%D9%84.jfif" alt="لوجو ابن هلال">
  </div>
  <h1>ابن هلال للمنظفات والمعطرات</h1>
</header>

<div class="container">
  <h2>منتجاتنا</h2>
  <div class="filters" id="filters"></div>
  <div class="products" id="products"><div class="loading">جاري تحميل المنتجات...</div></div>
</div>

<!-- نافذة السلة -->
<div class="cart-modal" id="cart-modal">
  <span class="close-cart" onclick="closeCart()">×</span>
  <h2 style="color:#27ae60">سلة المشتريات</h2>
  <div id="cart-items"></div>
  <div class="cart-total">الاجمالي: <span id="cart-total">0</span> جنيه</div>
  <button class="checkout-btn" onclick="checkout()">اطلب عبر واتساب</button>
</div>

<footer>
  <h3>تواصل معنا</h3>
  <p>📍 العنوان: اطسا - الفيوم</p>
  <p>📱 واتساب: 01120431784</p>
  <p>⏰ المواعيد: من 9 الصبح لـ 11 بالليل</p>
  <p style="margin-top:15px">© 2026 ابن هلال للمنظفات والمعطرات</p>
</footer>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSv7AAV_cVCseJEivgJi3ZKwCFPIa489jUtE5adrOuSBDMr9Kfn_gNJS9qSNfVhq-zv-KRnWOR0IiHf/pub?gid=1579048291&single=true&output=csv";
let allProducts = [];
let cart = [];

async function loadProducts() {
  const res = await fetch(SHEET_URL);
  const text = await res.text();
  const rows = text.trim().split("\n");
  rows.shift();
  allProducts = rows.map(row => {
    const cols = row.split(",");
    return {
      name: cols[0]?.trim(),
      price: parseFloat(cols[1]?.trim()) || 0,
      image: cols[2]?.trim(),
      category: cols[3]?.trim()
    };
  }).filter(p => p.name);
  showCategories();
  showProducts(allProducts);
}

function showCategories(){
  const categories = [...new Set(allProducts.map(p => p.category))].filter(c => c);
  let buttons = '<button class="active" onclick="filterProducts(\'all\', this)">الكل</button>';
  categories.forEach(cat => { buttons += `<button onclick="filterProducts('${cat}', this)">${cat}</button>`; });
  document.getElementById("filters").innerHTML = buttons;
}

function showProducts(products){
  let html = "";
  products.forEach((p, i) => {
    html += `
    <div class="card">
      <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/200'">
      <h3>${p.name}</h3>
      <p class="category">${p.category}</p>
      <p class="price">${p.price} جنيه</p>
      <button class="add-btn" onclick="addToCart(${i})">اضافة للسلة</button>
    </div>`;
  });
  document.getElementById("products").innerHTML = html;
}

function filterProducts(category, btn){
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if(category === 'all'){ showProducts(allProducts); }
  else { showProducts(allProducts.filter(p => p.category === category)); }
}

function addToCart(index){
  const product = allProducts[index];
  cart.push(product);
  document.getElementById("cart-count").innerText = cart.length;
  alert(`${product.name} تم اضافته للسلة`);
}

function openCart(){
  document.getElementById("cart-modal").style.display = "block";
  let html = ""; let total = 0;
  cart.forEach((item, i) => {
    html += `<div class="cart-item"><span>${item.name}</span><span>${item.price} ج</span></div>`;
    total += item.price;
  });
  document.getElementById("cart-items").innerHTML = html || "<p>السلة فاضية</p>";
  document.getElementById("cart-total").innerText = total;
}

function closeCart(){ document.getElementById("cart-modal").style.display = "none"; }

function checkout(){
  if(cart.length === 0) return alert("السلة فاضية");
  let message = "السلام عليكم، عايز اطلب:\n\n";
  cart.forEach(item => { message += `- ${item.name} : ${item.price} جنيه\n`; });
  const total = cart.reduce((sum, item) => sum + item.price, 0);
  message += `\nالاجمالي: ${total} جنيه`;
  window.open(`https://wa.me/201120431784?text=${encodeURIComponent(message)}`, '_blank');
}

loadProducts();
</script>
</body>
</html>
