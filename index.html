<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ابن هلال للمنظفات والمعطرات</title>
<style>
body{font-family:tahoma;background:#f8f9fa;margin:0;padding:0;color:#333}
header{background:linear-gradient(135deg,#27ae60,#2ecc71);color:white;text-align:center;padding:30px 20px}
.logo-box{background:#27ae60; padding:12px; border-radius:50%; display:inline-block; margin-bottom:15px; box-shadow:0 0 0 4px gold;}
.logo-box img{width:100px;height:100px;border-radius:50%;background:white;display:block;object-fit:contain;}
h1{margin:10px 0 0;font-size:24px}
.container{max-width:1000px;margin:20px auto;padding:20px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:white;border-radius:12px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1);text-align:center}
.card img{width:100%;height:200px;object-fit:cover;border-radius:8px}
.card h3{color:#27ae60;margin:10px 0}
footer{background:#2c3e50;color:white;text-align:center;padding:20px;margin-top:30px}
</style>
</head>
<body>

<header>
  <div class="logo-box">
    <img src="https://raw.githubusercontent.com/m876678998-del/ibn-helal/refs/heads/main/%D9%84%D9%88%D8%AC%D9%88%20%D8%A7%D8%A8%D9%86%20%D9%87%D9%84%D8%A7%D9%84.jfif" alt="لوجو ابن هلال">
  </div>
  <h1>ابن هلال للمنظفات والمعطرات</h1>
</header>

<div class="container">
  <h2 style="text-align:center; color:#27ae60;">منتجاتنا</h2>
  <div class="products">
    <div class="card">
      <img src="https://via.placeholder.com/300x200/27ae60/fff?text=كلوركس" alt="منتج">
      <h3>كلوركس</h3>
      <p>السعر: 25 جنيه</p>
    </div>
    <div class="card">
      <img src="https://via.placeholder.com/300x200/27ae60/fff?text=معطر" alt="منتج">
      <h3>معطر جو</h3>
      <p>السعر: 30 جنيه</p>
    </div>
    <div class="card">
      <img src="https://via.placeholder.com/300x200/27ae60/fff?text=صابون" alt="منتج">
      <h3>صابون سائل</h3>
      <p>السعر: 20 جنيه</p>
    </div>
  </div>
</div>

<footer>
  <p>للتواصل: 010xxxxxxxx | العنوان: طبهار - الفيوم</p>
  <p>© 2026 ابن هلال جميع الحقوق محفوظة</p>
</footer>

</body>
</html>
